name: Publish report

# Reusable: publishes the report section built earlier in the same run to GitHub Pages, next to the
# latest report of the other suite. Only the scheduled workflows call it, so pull requests never get
# Pages permissions.
on:
  workflow_call:
    inputs:
      suite:
        description: smoke or regression
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report-section-${{ inputs.suite }}
          path: site/${{ inputs.suite }}
      # The site holds the latest smoke and the latest regression report side by side.
      - name: Fetch the other suite's latest report
        run: scripts/ci/fetch-report-section.sh ${{ inputs.suite == 'smoke' && 'regression' || 'smoke' }} site/${{ inputs.suite == 'smoke' && 'regression' || 'smoke' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build landing page
        run: node scripts/build-pages-index.ts site
      - name: Publication gate (secrets and credentials)
        run: node scripts/scan-report.ts site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
